<!-- templates/index.html (Frontend) -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTrack Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .video-container { background: #1a1a1a; border-radius: 10px; overflow: hidden; }
        .stat-card { border-radius: 10px; padding: 20px; margin-bottom: 20px; }
        .progress { height: 25px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container-fluid py-4">
        <!-- Header -->
        <h1 class="text-center mb-4">FitTrack Dashboard</h1>

        <div class="row">
            <!-- Video Feed -->
            <div class="col-md-8">
                <div class="video-container">
                    <img src="{{ url_for('video_feed') }}" width="100%">
                </div>
            </div>

            <!-- Workout Stats -->
            <div class="col-md-4">
                <div class="row">
                    <div class="col-6">
                        <div class="stat-card bg-primary text-white">
                            <h5>Left Arm Reps</h5>
                            <h2 id="left-counter">0</h2>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="stat-card bg-danger text-white">
                            <h5>Right Arm Reps</h5>
                            <h2 id="right-counter">0</h2>
                        </div>
                    </div>
                </div>

                <!-- Progress Bars -->
                <div class="progress">
                    <div id="left-progress" class="progress-bar bg-primary" role="progressbar"></div>
                </div>
                <div class="progress">
                    <div id="right-progress" class="progress-bar bg-danger" role="progressbar"></div>
                </div>

                <!-- Diet Suggestions -->
                <div class="card mt-4">
                    <div class="card-body">
                        <h5 class="card-title">Diet Suggestions</h5>
                        <div id="meal-suggestions">
                            <p>High-protein meals recommended after workout</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Update workout data every second
        setInterval(() => {
            fetch('/workout_data')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('left-counter').textContent = data.left_counter;
                    document.getElementById('right-counter').textContent = data.right_counter;
                    
                    // Update progress bars (assuming 10 rep target)
                    document.getElementById('left-progress').style.width = 
                        Math.min((data.left_counter / 10) * 100, 100) + '%';
                    document.getElementById('right-progress').style.width = 
                        Math.min((data.right_counter / 10) * 100, 100) + '%';
                });
        }, 1000);

        // Sample diet suggestion logic
        function updateDietSuggestions() {
            const suggestions = [
                "Post-workout: Grilled chicken with quinoa",
                "Snack: Greek yogurt with berries",
                "Hydration: 500ml water immediately after workout"
            ];
            document.getElementById('meal-suggestions').innerHTML = 
                suggestions.map(s => `<p>${s}</p>`).join('');
        }
        updateDietSuggestions();
    </script>
</body>
</html>
